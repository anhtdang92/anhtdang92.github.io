<style>
/* Standalone page: GitHub Pages serves it at any missing URL depth, so every link and asset is root-absolute. */
:root{--bg:#04070d;--card:#0b1120;--border:rgba(255,255,255,0.12);--text:#eef3f9;--muted:#b0c8dc;--green:#00ff87;--cyan:#00d4ff;--purple:#e040fb;--on-accent:#04070d;--ff:'Outfit',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark}
[data-theme="light"]{--bg:#f4f6f9;--card:#ffffff;--border:rgba(0,0,0,0.12);--text:#151e2b;--muted:#2a4a62;--green:#007a45;--cyan:#006f99;--purple:#7e2bd0;--on-accent:#ffffff;color-scheme:light}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ff);line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100svh;text-align:center;padding:24px 16px}
main{width:100%;max-width:520px}
.code{font-family:var(--mono);font-size:clamp(72px,22vw,120px);font-weight:800;background:linear-gradient(135deg,var(--purple),var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:16px}
h1{font-size:24px;font-weight:600;margin-bottom:8px}
p{font-size:16px;color:var(--muted);margin-bottom:28px;line-height:1.6}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px}
.primary{display:inline-flex;align-items:center;justify-content:center;min-height:48px;font-family:var(--mono);font-size:14px;padding:12px 28px;border-radius:8px;background:var(--green);color:var(--on-accent);font-weight:700;text-decoration:none;transition:transform 0.2s,box-shadow 0.2s,filter 0.2s}
.primary:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,255,135,0.3)}
[data-theme="light"] .primary:hover{box-shadow:0 4px 20px rgba(0,122,69,0.25)}
.links{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);font-family:var(--mono);font-size:13px;color:var(--cyan);text-decoration:none;transition:border-color 0.2s,color 0.2s}
.links a:hover{border-color:var(--cyan);color:var(--text)}
a:focus-visible{outline:2px solid var(--text);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.primary,.links a{transition:none}.primary:hover{transform:none}}
</style>
